repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        pass_filenames: false
        args:
          - src/cc/adapters/base.py
          - src/cc/cartographer/audit.py
          - src/cc/cartographer/bounds.py
          - src/cc/cartographer/intervals.py
          - src/cc/io/storage.py
          - src/cc/utils/artifacts.py
          - src/cc/utils/timing.py
        files: ^(src/cc/adapters/base\.py|src/cc/cartographer/|src/cc/io/storage\.py|src/cc/utils/(artifacts|timing)\.py)$
