name: Bug report
description: Something in cc-framework is not behaving as documented.
title: "[bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Include the smallest script, command, or dataset slice that reproduces the issue.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: cc-framework version / commit
      placeholder: "0.3.0-rc1 or git SHA"
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Python version, OS, install command, and relevant dependency versions.
    validations:
      required: false
