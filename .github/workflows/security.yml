name: Security

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "22 9 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install security tooling
        run: |
          python -m pip install -U pip
          pip install -e .[security]
      - name: Bandit static scan
        run: bandit -q -r src/cc -x src/cc/_legacy --severity-level medium
      - name: Secret scan
        run: |
          detect-secrets scan \
            src scripts .github pyproject.toml Makefile README.md README_ENTERPRISE.md SECURITY.md docs \
            --exclude-files '(^|/)(artifacts/paper|docs/archive|docs/assets|site|node_modules|cdk\.out)(/|$)|package-lock\.json$' \
            > detect-secrets.json
          python scripts/check_detect_secrets_results.py detect-secrets.json
      - name: Dependency audit
        run: pip-audit --skip-editable
