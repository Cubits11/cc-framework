name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -e .[dev]
      - name: Lint
        run: ruff check .
      - name: Type check
        if: matrix.python-version == '3.12'
        run: |
          mypy \
            src/cc/adapters/base.py \
            src/cc/cartographer/audit.py \
            src/cc/cartographer/bounds.py \
            src/cc/cartographer/intervals.py \
            src/cc/io/storage.py \
            src/cc/utils/artifacts.py \
            src/cc/utils/timing.py
      - name: Artifact boundary
        if: matrix.python-version == '3.12'
        run: python scripts/check_artifact_boundary.py --static
      - name: Minimal example
        if: matrix.python-version == '3.12'
        run: python examples/minimal/run_bounds.py
      - name: Tests
        run: pytest -q

  conformance:
    name: cross-implementation agreement
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The Node implementation is deliberately not installed from npm: it has
      # zero dependencies, so a bare runtime is the whole requirement.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e '.[test]'
      - name: Corpus is current
        run: python scripts/build_conformance_corpus.py --check
      - name: Independent Node implementation agrees
        run: node verifiers/node/cc_compose_verify.mjs
      - name: Differential fuzz
        run: python scripts/differential_compose.py --cases 4000 --seed 1
      - name: Conformance and acceptance suites
        run: pytest -q tests/conformance tests/acceptance tests/unit/compose tests/unit/cli

  test-extra-is-sufficient:
    name: the documented install path works
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Installs '.[test]' SPECIFICALLY, not '.[dev]'. The extra strangers are
      # told to use must be the extra that is tested; before this job the two
      # diverged and the documented path produced a red suite (finding F-01).
      - name: Install the documented test extra
        run: |
          python -m pip install -U pip
          pip install -e '.[test]'
      - name: Tests
        run: pytest -q

  package-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        run: |
          python -m pip install -U pip
          pip install -e '.[dev]'
      - name: Build package
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*

  enterprise-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python enterprise dependencies
        run: |
          python -m pip install -U pip
          pip install -e '.[enterprise,test]'
      - name: Install and synthesize CDK
        working-directory: infra
        run: |
          npm ci
          npm run build
          npm run synth
      - name: Install and build dashboard
        working-directory: apps/dashboard
        run: |
          npm ci
          npm run build
      - name: Enterprise emulation and dashboard smoke
        run: |
          pytest tests/integration/test_enterprise_aws_emulation.py tests/e2e/test_enterprise_smoke.py
